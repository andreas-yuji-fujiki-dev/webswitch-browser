<!doctype html>
<title>js/dom bench</title>
<body><div id="sandbox"></div>
<script>
  // The same synchronous benchmarks in every browser. Each one runs 5 times; the median counts.
  const median = (xs) => xs.slice().sort((a, b) => a - b)[Math.floor(xs.length / 2)];
  const time = (fn) => { const t = performance.now(); fn(); return performance.now() - t; };
  const runs = (fn) => median(Array.from({ length: 5 }, () => time(fn)));

  const suite = {
    'recursion fib(30)': () => { const fib = (n) => (n < 2 ? n : fib(n - 1) + fib(n - 2)); fib(30); },
    'sort 500k numbers': () => { const a = Array.from({ length: 500000 }, (_, i) => (i * 2654435761) % 1000003); a.sort((x, y) => x - y); },
    'string + regex': () => {
      let s = ''; for (let i = 0; i < 60000; i++) s += 'word' + (i % 97) + ' ';
      let n = 0; for (let i = 0; i < 20; i++) n += s.replace(/word(\d+)/g, (m, d) => d).length + (s.match(/\bword\d\b/g) || []).length;
      return n;
    },
    'JSON 30k objects': () => {
      const o = Array.from({ length: 30000 }, (_, i) => ({ id: i, name: 'item' + i, tags: ['a', 'b', 'c'], nested: { x: i, y: i * 2 } }));
      JSON.parse(JSON.stringify(o));
    },
    'Map/Set + objects': () => {
      const m = new Map(); const s = new Set();
      for (let i = 0; i < 400000; i++) { m.set('k' + i, { v: i }); s.add(i % 5000); }
      let t = 0; for (const [, v] of m) t += v.v; return t;
    },
    'typed array math': () => {
      const a = new Float64Array(2000000); for (let i = 0; i < a.length; i++) a[i] = Math.sin(i) * Math.sqrt(i);
      let t = 0; for (let i = 0; i < a.length; i++) t += a[i]; return t;
    },
    'DOM build 15k nodes': () => {
      const box = document.getElementById('sandbox'); box.textContent = '';
      for (let i = 0; i < 15000; i++) { const d = document.createElement('div'); d.className = 'row r' + (i % 7); d.textContent = 'row ' + i; box.appendChild(d); }
      box.offsetHeight; box.textContent = '';
    },
    'style + reflow 4k': () => {
      const box = document.getElementById('sandbox'); box.textContent = '';
      const els = Array.from({ length: 4000 }, (_, i) => { const d = document.createElement('div'); d.textContent = 'x' + i; box.appendChild(d); return d; });
      for (let r = 0; r < 6; r++) { els.forEach((d, i) => { d.style.width = (100 + ((i + r) % 50)) + 'px'; d.style.padding = (r % 3) + 'px'; }); box.offsetHeight; }
      box.textContent = '';
    },
    'canvas 2D 150k ops': () => {
      const c = document.createElement('canvas'); c.width = 800; c.height = 600; const x = c.getContext('2d');
      for (let i = 0; i < 150000; i++) { x.fillStyle = 'rgb(' + (i % 255) + ',' + (i * 3 % 255) + ',120)'; x.fillRect((i * 13) % 780, (i * 7) % 580, 12, 12); }
    },
  };

  const results = {};
  for (const [name, fn] of Object.entries(suite)) results[name] = Math.round(runs(fn) * 10) / 10;
  const total = Math.round(Object.values(results).reduce((a, b) => a + b, 0));
  document.title = 'done ' + total;
  fetch('/result' + location.search, { method: 'POST', body: JSON.stringify({ results, total, agent: navigator.userAgent }) });
</script>
